<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#173e35" />
  <title>Nutrizione Clinica</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="brand-mark">NC</div>
      <div>
        <p class="eyebrow">Nutrizione Clinica</p>
        <h1>Accedi all’area riservata</h1>
        <p class="muted">Nutrizionisti e pazienti accedono con il proprio account.</p>
      </div>
      <form id="loginForm" class="stack-lg">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required /></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button class="btn primary" type="submit">Accedi</button>
      </form>
      <button id="recoveryBtn" class="link-btn" type="button">Primo accesso / password dimenticata</button>
      <form id="passwordForm" class="stack-lg hidden">
        <label>Nuova password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button class="btn primary" type="submit">Imposta nuova password</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark small">NC</div>
        <div><strong>Nutrizione Clinica</strong><span id="roleLabel">Gestionale nutrizionale</span></div>
      </div>
      <nav id="mainNav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip"><span id="userInitials">N</span><div><strong id="userName">Utente</strong><small id="userEmail"></small></div></div>
        <button id="logoutBtn" class="btn ghost full">Esci</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p id="pageEyebrow" class="eyebrow">Nutrizione Clinica</p><h2 id="pageTitle">Dashboard</h2><p id="pageSubtitle" class="muted top-subtitle"></p></div>
        <div class="topbar-actions"><span class="status-pill"><i></i> Connesso</span><button id="mobileNavBtn" class="btn mobile-only">Menu</button></div>
      </header>
      <div id="pageRoot"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" type="button" data-close-modal>×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay hidden"><div class="loader-card"><div class="spinner"></div><h3 id="loadingTitle">Caricamento</h3><p id="loadingText">Operazione in corso…</p></div></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
